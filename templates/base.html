{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{% block title %}MBAxMS Class Directory{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{% url 'profiles:list' %}">MBAxMS <span>Class Directory</span></a>
      {% if request.session.class_directory_access_granted %}
        <form action="{% url 'access_control:logout' %}" method="post">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-light" type="submit">Log out</button>
        </form>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
