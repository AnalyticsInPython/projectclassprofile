{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{% block title %}MBAxMS Class Directory{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{% url 'profiles:list' %}"><span data-i18n="brand">MBAxMS</span> <span data-i18n="brand_subtitle">Class Directory</span></a>
      {% if request.session.class_directory_access_granted %}
        <form action="{% url 'access_control:logout' %}" method="post">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-light" type="submit" data-i18n="logout">Log out</button>
        </form>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-copy" data-i18n="footer_copyright">© 2028 MBAxMS</span>

      <div class="footer-settings" aria-label="Language settings">
        <label class="translate-label" for="language-select" data-i18n="translate_label">Translate</label>
        <select id="language-select" class="language-select" aria-label="Select language">
          <option value="English" selected>English</option>
          <option value="Español">Español</option>
          <option value="Français">Français</option>
          <option value="Deutsch">Deutsch</option>
          <option value="Italiano">Italiano</option>
          <option value="Português">Português</option>
          <option value="Русский">Русский</option>
          <option value="日本語">日本語</option>
          <option value="한국어">한국어</option>
          <option value="中文 (简体)">中文 (简体)</option>
          <option value="中文 (繁體)">中文 (繁體)</option>
          <option value="العربية">العربية</option>
          <option value="हिन्दी">हिन्दी</option>

    function applyTranslations(language) {
      const mapping = translations[language] || translations.English;
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        if (mapping[element.dataset.i18n]) {
          element.textContent = mapping[element.dataset.i18n];
        }
      });

      const inputs = {
        email: document.querySelector('input[name="email"]'),
        access_code: document.querySelector('input[name="access_code"]')
      };

      if (inputs.email) {
        const emailLabel = document.querySelector('label[for="id_email"]');
        if (emailLabel) emailLabel.textContent = mapping.email_label;
        inputs.email.placeholder = mapping.email_placeholder;
      }

      if (inputs.access_code) {
        const accessLabel = document.querySelector('label[for="id_access_code"]');
        if (accessLabel) accessLabel.textContent = mapping.access_code_label;
        inputs.access_code.placeholder = mapping.access_code_placeholder;
      }

      const loginCard = document.querySelector('.login-card');
      if (loginCard) {
        const formButton = loginCard.querySelector('button[type="submit"]');
        if (formButton && mapping.submit) formButton.textContent = mapping.submit;
      }

      const select = document.getElementById('language-select');
      if (select) {
        select.value = language;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('language-select');
      const language = select ? select.value : 'English';
      applyTranslations(language);

      if (select) {
        select.addEventListener('change', (event) => {
          applyTranslations(event.target.value);
        });
      }
    });
  </script>
